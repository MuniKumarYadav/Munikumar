<!doctype html>
<html lang="en-IN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Marketing Requirements Assistant | Muni Kumar</title><meta name="description" content="Answer a few questions about your business and digital marketing goals. The MuniSoft AI Marketing Assistant organizes your requirements into a project brief."><style>:root{--bg:#030b1f;--panel:#071a36;--line:rgba(56,189,248,.2);--text:#eef6ff;--muted:#9ab0cf;--cyan:#38bdf8;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,rgba(37,99,235,.22),transparent 35%),radial-gradient(circle at 80% 0%,rgba(56,189,248,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.top{padding:24px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:-.03em}.brand span{color:var(--cyan)}.back{color:#c8efff;text-decoration:none;font-weight:700}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;padding:20px 0 60px}.bot{border:1px solid var(--line);border-radius:28px;padding:22px;background:linear-gradient(180deg,rgba(10,35,76,.9),rgba(5,17,34,.92));height:max-content;position:sticky;top:16px}.robot{width:92px;height:92px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#93c5fd);position:relative}.robot:before{content:'🤖';font-size:48px;filter:drop-shadow(0 7px 14px rgba(0,0,0,.2))}.pulse{position:absolute;right:7px;bottom:8px;width:12px;height:12px;border-radius:50%;background:#34d399;box-shadow:0 0 0 7px rgba(52,211,153,.12)}.bot h2{font-size:21px;text-align:center;margin:6px 0}.bot p{color:var(--muted);line-height:1.65;font-size:13px;text-align:center}.progress{height:8px;background:#0b2445;border-radius:999px;overflow:hidden;margin-top:20px}.bar{height:100%;width:14%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.25s}.card{border:1px solid var(--line);border-radius:28px;padding:30px;background:rgba(5,17,34,.82);backdrop-filter:blur(12px)}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:900;color:#67e8f9}.question{font-size:34px;line-height:1.15;margin:12px 0}.sub{color:var(--muted);margin:0 0 22px;line-height:1.7}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:1px solid rgba(148,163,184,.2);background:#081a33;color:var(--text);border-radius:16px;padding:16px;text-align:left;cursor:pointer;font:inherit}.option:hover,.option.active{border-color:var(--cyan);background:#0b254a}.option small{display:block;color:var(--muted);margin-top:4px}.inputrow{display:grid;gap:10px}.inputrow input,.inputrow textarea,.inputrow select{width:100%;background:#061426;color:#fff;border:1px solid #29425f;border-radius:12px;padding:14px;font:inherit}.inputrow textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn{border:1px solid #36516f;background:#081a33;color:#eaf5ff;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.btn.primary{border:0;background:linear-gradient(90deg,var(--blue),var(--cyan));color:#03121f}.summary{display:grid;gap:12px}.summary .item{padding:14px;border:1px solid rgba(148,163,184,.16);border-radius:14px;background:#061426}.summary b{display:block}.summary span{color:var(--muted);font-size:13px}.success{border:1px solid rgba(52,211,153,.28);background:rgba(16,185,129,.08);padding:16px;border-radius:16px;color:#d1fae5;margin-bottom:18px}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.bot{position:static}.options{grid-template-columns:1fr}.question{font-size:28px}}</style></head>
<body><header class="wrap top"><div class="brand">MuniSoft<span>.Tech</span></div><a class="back" href="index.html">← Back to website</a></header><main class="wrap layout"><aside class="bot"><div class="robot"><i class="pulse"></i></div><h2>MuniBot</h2><p>I'm your digital marketing requirements assistant. I'll ask a few focused questions and turn your answers into a useful project brief.</p><div class="progress"><div id="bar" class="bar"></div></div><p id="stepText" style="margin-bottom:0">Step 1 of 7</p></aside><section class="card"><div id="wizard"></div></section></main><script>
const questions=[
 {key:'business',title:'What does your business do?',sub:'Tell me what you sell, who you serve and the market you operate in.',type:'text',placeholder:'Example: B2B SaaS for small businesses in India'},
 {key:'goal',title:'What is your biggest digital marketing goal?',sub:'Choose the outcome that matters most right now.',type:'options',options:[['Leads','Generate more qualified enquiries'],['Sales','Increase online conversions or revenue'],['Visibility','Improve brand and search visibility'],['Authority','Build trust, content and expertise'],['Automation','Reduce repetitive marketing work'],['Launch','Launch a new website, product or campaign']]},
 {key:'services',title:'Which areas do you need help with?',sub:'Select the areas you want in the scope.',type:'multi',options:[['SEO','Organic search visibility'],['AEO / GEO','Answer and generative search visibility'],['Social Media','Content and social growth'],['Paid Ads','Google/Meta/other paid campaigns'],['Content','Blogs, landing pages and strategy'],['AI Automation','Lead, content and reporting workflows'],['Website','Website, landing pages or conversion UX'],['Analytics','Tracking, attribution and reporting']]},
 {key:'audience',title:'Who is your target audience?',sub:'Describe your ideal customer or segment.',type:'text',placeholder:'Example: Local service businesses, founders, marketing managers'},
 {key:'channels',title:'Where do you currently get traffic or leads?',sub:'Select everything that applies.',type:'multi',options:[['Google Search','Organic search'],['Social','Instagram, Facebook, LinkedIn, etc.'],['Ads','Google Ads, Meta Ads, etc.'],['Referrals','Partners, word of mouth'],['Email','Email/newsletters'],['Direct','Existing audience/direct traffic'],['Not sure','I need an audit']]},
 {key:'budget',title:'What is your expected monthly marketing investment?',sub:'A range is enough. This helps scope a realistic strategy.',type:'options',options:[['Under ₹25k','Lean test-and-learn'],['₹25k–₹75k','Focused growth'],['₹75k–₹2L','Multi-channel growth'],['₹2L+','Scale and performance'],['Not decided','Recommend a starting range']]},
 {key:'contact',title:'Where should I send the requirement summary?',sub:'Add your details and the assistant will submit a structured brief.',type:'contact'}
];
const a={};let i=0;const root=document.getElementById('wizard');
function render(){const q=questions[i];document.getElementById('bar').style.width=((i+1)/questions.length*100)+'%';document.getElementById('stepText').textContent='Step '+(i+1)+' of '+questions.length; if(q.type==='text')return root.innerHTML='<div class="eyebrow">YOUR BUSINESS</div><h1 class="question">'+q.title+'</h1><p class="sub">'+q.sub+'</p><div class="inputrow"><textarea id="free" placeholder="'+q.placeholder+'">'+(a[q.key]||'')+'</textarea></div>'+actions(); if(q.type==='contact')return root.innerHTML='<div class="eyebrow">FINAL STEP</div><h1 class="question">Let’s create your marketing brief.</h1><p class="sub">We’ll capture your contact details and your answers as a structured enquiry.</p><div class="inputrow"><input id="name" placeholder="Your name" required value="'+(a.name||'')+'"><input id="email" type="email" placeholder="Work email" required value="'+(a.email||'')+'"><input id="phone" placeholder="Phone / WhatsApp" value="'+(a.phone||'')+'"><textarea id="notes" placeholder="Anything else I should know?">'+(a.notes||'')+'</textarea></div>'+actions('Submit requirements'); if(q.type==='multi')return root.innerHTML='<div class="eyebrow">MULTI-SELECT</div><h1 class="question">'+q.title+'</h1><p class="sub">'+q.sub+'</p><div class="options">'+q.options.map((x,j)=>'<button class="option '+((a[q.key]||[]).includes(x[0])?'active':'')+'" data-v="'+x[0]+'" onclick="toggle(this,\''+q.key+'\')">'+x[0]+'<small>'+x[1]+'</small></button>').join('')+'</div>'+actions();return root.innerHTML='<div class="eyebrow">REQUIREMENTS</div><h1 class="question">'+q.title+'</h1><p class="sub">'+q.sub+'</p><div class="options">'+q.options.map(x=>'<button class="option '+(a[q.key]===x[0]?'active':'')+'" onclick="pick(\''+q.key+'\',\''+x[0]+'\')">'+x[0]+'<small>'+x[1]+'</small></button>').join('')+'</div>'+actions();}
function actions(next='Next question'){return '<div class="actions">'+(i?'<button class="btn" onclick="prev()">Back</button>':'<span></span>')+'<button class="btn primary" onclick="nextStep()">'+next+' →</button></div>'}
function pick(k,v){a[k]=v;render()} function toggle(el,k){a[k]=a[k]||[];const v=el.dataset.v;a[k]=a[k].includes(v)?a[k].filter(x=>x!==v):[...a[k],v];render()} function prev(){i--;render()}
async function nextStep(){const q=questions[i];if(q.type==='text'){a[q.key]=document.getElementById('free').value.trim();if(!a[q.key])return alert('Please answer this question.')}if(q.type==='options'&&!a[q.key])return alert('Choose one option to continue.');if(q.type==='multi'&&(!a[q.key]||!a[q.key].length))return alert('Choose at least one option.');if(q.type==='contact'){a.name=document.getElementById('name').value.trim();a.email=document.getElementById('email').value.trim();a.phone=document.getElementById('phone').value.trim();a.notes=document.getElementById('notes').value.trim();if(!a.name||!a.email||!a.email.includes('@'))return alert('Please provide your name and a valid email.');return submit()}i++;render()}
async function submit(){root.innerHTML='<div class="success">Your requirements are being submitted securely…</div>';const p=new URLSearchParams(location.search);const payload={name:a.name,email:a.email,phone:a.phone,company:a.business,service_interest:(a.services||[]).join(', '),message:'Digital marketing requirement interview\nGoal: '+(a.goal||'')+'\nTarget audience: '+(a.audience||'')+'\nCurrent channels: '+(a.channels||[]).join(', ')+'\nBudget: '+(a.budget||'')+'\nAdditional notes: '+(a.notes||''),utm_source:p.get('utm_source')||'',utm_medium:p.get('utm_medium')||'',utm_campaign:p.get('utm_campaign')||'',utm_term:p.get('utm_term')||'',utm_content:p.get('utm_content')||'',landing_page:location.href,referrer:document.referrer};try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to submit');const nice=['business','goal','services','audience','channels','budget'].map(k=>'<div class="item"><b>'+k.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase())+'</b><span>'+((Array.isArray(a[k])?a[k].join(', '):a[k])||'Not provided')+'</span></div>').join('');root.innerHTML='<div class="success"><strong>Thank you, '+a.name+'.</strong><br>Your digital marketing requirements have been received.</div><div class="summary">'+nice+'</div><div class="actions"><a class="btn primary" href="index.html">Return to MuniSoft.Tech →</a></div>'}catch(e){root.innerHTML='<div class="success" style="color:#fecaca;background:rgba(127,29,29,.16)">'+(e.message||'Submission failed. Please try again from the contact page.')+'</div>'+actions('Try again')}}
render();</script></body></html>
