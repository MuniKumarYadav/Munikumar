<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuniBot Dynamic Marketing Assistant</title><style>body{font-family:system-ui;margin:0;background:#030b1f;color:#eef6ff}.wrap{max-width:820px;margin:auto;padding:28px}.bot{background:#081a3a;border:1px solid #21446f;border-radius:24px;padding:26px}.q{font-size:28px;font-weight:800}.opts{display:grid;gap:10px;margin:22px 0}.opts button,input,textarea{padding:14px;border-radius:12px;border:1px solid #315476;background:#061426;color:white;font:inherit;text-align:left}.opts button:hover{border-color:#38bdf8}.row{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#38bdf8;color:#04121d!important;font-weight:800;cursor:pointer}.muted{color:#9ab0cf}.progress{height:8px;background:#102746;border-radius:99px}.bar{height:100%;background:#38bdf8;border-radius:99px;width:0%;transition:.2s}.tag{display:inline-block;padding:8px 10px;border:1px solid #315476;border-radius:99px;margin:4px;cursor:pointer}.tag.on{background:#38bdf8;color:#04121d}</style></head><body><main class="wrap"><p class="muted">MuniSoft.Tech / Dynamic Python Backend</p><div class="bot"><div class="progress"><div class="bar" id="bar"></div></div><p id="step" class="muted"></p><div id="app"></div></div></main><script>
const state={services:[]};const qs=[
['business','What does your business do?','textarea'],
['goal','What is your biggest goal?','options',['More qualified leads','More sales','Better visibility','Marketing automation','Website growth']],
['services','Which services do you need?','multi',['SEO','AEO / GEO','Social Media','Paid Ads','Content','AI Automation','Website','Analytics']],
['audience','Who is your target audience?','textarea'],
['budget','What monthly marketing budget range are you considering?','options',['Under ₹25,000','₹25,000–₹50,000','₹50,000–₹1,00,000','₹1,00,000+','Need guidance']],
['contact','Where should I send your project brief?','contact']
];let i=0;const app=document.getElementById('app');
function render(){const q=qs[i];document.getElementById('bar').style.width=((i)/qs.length*100)+'%';document.getElementById('step').textContent='Question '+(i+1)+' of '+qs.length;let h='<div class="q">'+q[1]+'</div>';if(q[2]=='textarea')h+='<div class="opts"><textarea id="v" rows="5" placeholder="Type your answer...">'+(state[q[0]]||'')+'</textarea></div>';if(q[2]=='options')h+='<div class="opts">'+q[3].map(x=>'<button onclick="pick('+JSON.stringify(x)+')">'+x+'</button>').join('')+'</div>';if(q[2]=='multi')h+='<div class="opts">'+q[3].map(x=>'<span class="tag '+(state.services.includes(x)?'on':'')+'" onclick="toggle('+JSON.stringify(x)+')">'+x+'</span>').join('')+'</div>';if(q[2]=='contact')h+='<div class="opts"><input id="name" placeholder="Your name"><input id="email" type="email" placeholder="Email"><input id="company" placeholder="Company"><input id="phone" placeholder="Phone / WhatsApp"></div>';h+='<div class="row"><button onclick="back()">Back</button>'+(q[2]=='options'?'' : '<button class="primary" onclick="next()">'+(i==qs.length-1?'Get my brief':'Continue')+'</button>')+'</div>';app.innerHTML=h}
function pick(x){state[qs[i][0]]=x;next()}function toggle(x){const a=state.services;const p=a.indexOf(x);p<0?a.push(x):a.splice(p,1);render()}function back(){if(i){i--;render()}}function next(){const q=qs[i];if(q[2]=='textarea'){const v=document.getElementById('v').value.trim();if(!v)return;state[q[0]]=v}if(q[2]=='contact'){state.contact={name:document.getElementById('name').value,email:document.getElementById('email').value,company:document.getElementById('company').value,phone:document.getElementById('phone').value};if(!state.contact.name||!state.contact.email)return}if(i<qs.length-1){i++;render()}else submit()}
async function submit(){app.innerHTML='<div class="q">MuniBot is creating your marketing brief…</div>';const u=new URLSearchParams(location.search);Object.assign(state,{landing_page:location.href,referrer:document.referrer,...Object.fromEntries(u)});try{const r=await fetch('/api/requirements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});const d=await r.json();if(!r.ok)throw new Error(d.error);app.innerHTML='<div class="q">Your requirements are received 🤖</div><p class="muted">Recommended starting areas:</p><div class="opts">'+d.brief.recommendations.map(x=>'<div class="tag on">'+x+'</div>').join('')+'</div><p>Thank you, '+state.contact.name+'. MuniBot has structured your requirements for the marketing team.</p>'}catch(e){app.innerHTML='<div class="q">Something needs attention</div><p>'+e.message+'</p><button class="primary" onclick="i=qs.length-1;render()">Try again</button>'}}render();
</script></body></html>
