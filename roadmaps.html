<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Marketing Roadmaps | MuniGrowth.AI</title>
<meta name="description" content="Interactive learning roadmaps for SEO, AEO, GEO, content marketing, paid media, analytics, social media and digital growth.">
<link rel="canonical" href="https://munikumar.vercel.app/roadmaps.html">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>body{background:#07111f;color:#e8f0fa;font-family:Inter,sans-serif}.font-display{font-family:'Space Grotesk',sans-serif}.brand-mark{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#06b6d4,#7c3aed);box-shadow:0 0 24px rgba(34,211,238,.2);color:white;font-size:15px}.glass{background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.15);backdrop-filter:blur(16px)}.gradient-text{background:linear-gradient(90deg,#22d3ee,#60a5fa,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}.node{transition:.25s}.node:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.55);box-shadow:0 18px 45px rgba(8,145,178,.12)}.path:after{content:'';position:absolute;left:50%;top:100%;width:2px;height:24px;background:linear-gradient(#22d3ee,transparent)}.done{background:rgba(16,185,129,.1)!important;border-color:rgba(16,185,129,.45)!important}.grid-bg{background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:42px 42px}</style>
</head>
<body class="antialiased grid-bg">
<header class="sticky top-0 z-50 glass"><nav class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between"><a href="index.html" class="flex items-center gap-3"><span class="brand-mark" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span><span class="font-display font-bold text-xl"><span class="text-cyan-400">Muni</span>Growth<span class="text-indigo-400">.AI</span><small class="block text-[9px] text-slate-500 tracking-[.18em] font-sans">AI-POWERED DIGITAL GROWTH</small></span></a><div class="flex gap-2"><a href="index.html" class="px-4 py-2 rounded-lg glass text-sm">Home</a><a href="blogs.html" class="px-4 py-2 rounded-lg bg-indigo-600 text-sm font-semibold">50 Blogs</a></div></nav></header>
<main class="max-w-7xl mx-auto px-5 py-16">
<section class="text-center max-w-4xl mx-auto"><span class="text-cyan-400 text-xs font-mono uppercase tracking-widest">Learning dashboard</span><h1 class="font-display text-5xl md:text-6xl font-bold mt-4">Digital Marketing <span class="gradient-text">Roadmaps</span></h1><p class="text-slate-400 text-lg mt-5">Choose a path, track your progress and move from fundamentals to advanced digital growth. Built as an original roadmap experience—not a copy of any third-party site.</p></section>
<div class="mt-12 flex flex-wrap justify-center gap-2" id="filters"></div>
<section id="cards" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5 mt-8"></section>
<section id="roadmap" class="hidden mt-10"></section>
</main>
<script>
const roads=[
['seo','SEO Roadmap','Search Engine Optimization','From crawling and indexing to technical SEO, topical authority and measurement.','cyan',['Search fundamentals','Keyword & intent research','Technical SEO','On-page optimization','Internal linking','Content clusters','Digital PR & links','Core Web Vitals','Structured data','SEO analytics']],
['aeo','AEO Roadmap','Answer Engine Optimization','Build content that answers real questions clearly across modern answer experiences.','blue',['Question research','Search intent','Direct-answer writing','FAQ architecture','Featured-snippet formats','Conversational content','Entity definitions','Source citations','Answer measurement','Content refresh']],
['geo','GEO Roadmap','Generative Engine Optimization','Develop entity clarity, evidence and authority for generative search visibility.','indigo',['Generative search basics','Entity mapping','Brand knowledge graph','First-party evidence','Third-party mentions','Expert authorship','Citation-worthy content','Digital PR','AI visibility testing','GEO measurement']],
['content','Content Marketing','Content Strategy','Plan, create, distribute and measure content that earns attention and conversions.','purple',['Audience research','Content positioning','Topic clusters','Editorial calendar','Briefs & outlines','Expert-led content','Distribution','Repurposing','Conversion paths','Content ROI']],
['analytics','Marketing Analytics','GA4 & Measurement','Build a measurement system from events and funnels to dashboards and attribution.','emerald',['Measurement plan','UTM governance','GA4 basics','Events & conversions','Search Console','Looker Studio','Funnel analysis','Cohort analysis','Attribution','Experimentation']],
['ppc','PPC & Paid Media','Paid Acquisition','Learn campaign structure, creative testing, bidding, landing pages and optimization.','amber',['Channel fundamentals','Audience research','Campaign structure','Keyword targeting','Ad copy','Creative testing','Landing pages','Bidding & budgets','Retargeting','ROAS optimization']],
['social','Social Media','Organic Social','Build a repeatable system for audience growth, community and content distribution.','pink',['Platform strategy','Audience research','Content pillars','Short-form video','Copywriting','Community management','Creator partnerships','Distribution','Social SEO','Performance analysis']],
['email','Email Marketing','Lifecycle Marketing','Turn subscribers into engaged customers through segmentation, automation and testing.','rose',['List building','Lead magnets','Segmentation','Copywriting','Welcome flows','Nurture sequences','Promotional campaigns','Deliverability','A/B testing','Revenue measurement']],
['brand','Digital Brand','Brand & Demand','Create recognizable positioning and a demand engine across search, content and social.','violet',['Market research','Positioning','Messaging','Brand identity','Content voice','Demand creation','Authority building','PR & partnerships','Community','Brand measurement']],
['ai','AI Marketing','AI-Powered Marketing','Use AI responsibly for research, workflows, content operations, experimentation and productivity.','teal',['AI fundamentals','Prompt systems','Research workflows','Content assistance','Automation','AI agents','Data enrichment','Personalization','Evaluation','AI governance']]
];
const cats=[['all','All'],['search','Search'],['content','Content'],['growth','Growth'],['ai','AI']];
const searchIds=['seo','aeo','geo'];const contentIds=['content','social','email'];const growthIds=['analytics','ppc','brand'];
const filters=document.getElementById('filters'),cards=document.getElementById('cards'),roadmap=document.getElementById('roadmap');let active='all';
function category(id){return searchIds.includes(id)?'search':contentIds.includes(id)?'content':growthIds.includes(id)?'growth':'ai'}
function renderFilters(){filters.innerHTML=cats.map(([id,n])=>`<button onclick="setFilter('${id}')" class="filter px-4 py-2 rounded-lg text-sm ${active===id?'bg-cyan-500 text-slate-950 font-bold':'glass text-slate-300'}">${n}</button>`).join('')}
function setFilter(id){active=id;renderFilters();renderCards()}
function renderCards(){const list=roads.filter(r=>active==='all'||category(r[0])===active);cards.innerHTML=list.map(r=>`<article class="glass rounded-2xl p-6 node"><div class="flex justify-between"><span class="text-xs font-mono text-${r[4]}-400 uppercase">${category(r[0])}</span><span class="text-xs text-slate-500">10 stages</span></div><h2 class="font-display text-2xl font-bold mt-4">${r[1]}</h2><p class="text-cyan-300 text-sm mt-1">${r[2]}</p><p class="text-slate-400 text-sm mt-4 leading-6">${r[3]}</p><div class="flex flex-wrap gap-2 mt-5">${r[5].slice(0,4).map(x=>`<span class="px-2 py-1 rounded bg-slate-800 text-xs text-slate-300">${x}</span>`).join('')}</div><button onclick="openRoadmap('${r[0]}')" class="w-full mt-6 px-4 py-3 rounded-xl bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 font-semibold transition">Open roadmap →</button></article>`).join('')}
function openRoadmap(id){const r=roads.find(x=>x[0]===id);if(!r)return;cards.classList.add('hidden');filters.classList.add('hidden');roadmap.classList.remove('hidden');roadmap.innerHTML=`<div class="flex flex-col md:flex-row md:items-end justify-between gap-5 mb-8"><div><button onclick="closeRoadmap()" class="text-cyan-400 text-sm mb-4">← Back to all roadmaps</button><h2 class="font-display text-4xl font-bold">${r[1]}</h2><p class="text-slate-400 mt-2">${r[3]}</p></div><div class="glass px-5 py-3 rounded-xl text-sm"><span id="progress">0%</span> complete</div></div><div class="grid lg:grid-cols-[1fr_320px] gap-8"><div>${r[5].map((stage,i)=>`<article class="path relative pb-6"><button onclick="toggleNode('${id}',${i})" class="node glass w-full text-left rounded-2xl p-5 flex items-center gap-4" id="${id}-${i}"><span class="w-10 h-10 shrink-0 rounded-full bg-slate-800 flex items-center justify-center font-bold text-cyan-400">${i+1}</span><span><b class="block">${stage}</b><small class="text-slate-500">Stage ${i+1} · click to mark complete</small></span><span class="ml-auto text-slate-600">✓</span></button></article>`).join('')}</div><aside class="glass rounded-2xl p-6 h-fit sticky top-24"><h3 class="font-display font-bold text-xl">Learning checklist</h3><p class="text-sm text-slate-400 mt-2">Complete each stage in order, then revisit weak areas with the 50-blog knowledge hub.</p><a href="blogs.html" class="block mt-5 text-center px-4 py-3 rounded-xl bg-indigo-600 font-semibold">Read related insights</a><div class="mt-6 text-xs text-slate-500">Recommended: 30–60 min/day · build projects as you learn.</div></aside></div>`;window.scrollTo({top:0,behavior:'smooth'});updateProgress(id,r[5].length)}
function toggleNode(id,i){const el=document.getElementById(`${id}-${i}`);el.classList.toggle('done');el.querySelector('span:last-child').textContent=el.classList.contains('done')?'✓':'○';updateProgress(id,document.querySelectorAll(`[id^="${id}-"].done`).length)}
function updateProgress(id,total){const count=document.querySelectorAll(`[id^="${id}-"].done`).length;document.getElementById('progress').textContent=Math.round(count/total*100)+'%'}
function closeRoadmap(){roadmap.classList.add('hidden');cards.classList.remove('hidden');filters.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
renderFilters();renderCards();
</script>
</body></html>
