<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Digital marketing strategy and social media</title>
<desc id="d">A premium digital marketing scene with a smartphone, campaign analytics and floating social media, email, search and growth symbols.</desc>
<defs>
<radialGradient id="bg" cx="55%" cy="45%" r="75%"><stop offset="0" stop-color="#18264a"/><stop offset=".55" stop-color="#090e1d"/><stop offset="1" stop-color="#03050b"/></radialGradient>
<linearGradient id="phone" x1="0" x2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#aebbd1"/></linearGradient>
<linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff6b2c"/><stop offset="1" stop-color="#ffb31a"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-opacity=".55"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="800" cy="790" rx="590" ry="90" fill="#000" opacity=".55"/>
<!-- abstract person -->
<path d="M250 0h1100l-90 330-190 170-370-70-350 100-150-210z" fill="#080b18"/>
<path d="M470 410c130-105 290-110 390-20l-40 190-340 20z" fill="#10172c" opacity=".95"/>
<path d="M1110 420c-110-80-260-80-350 10l45 190 340 10z" fill="#0d1428"/>
<!-- desk -->
<path d="M0 700h1600v200H0z" fill="#0a0d14"/>
<path d="M0 700h1600v22H0z" fill="#242a35" opacity=".5"/>
<!-- phone -->
<g filter="url(#shadow)" transform="translate(625 465) rotate(-4)">
<rect width="365" height="230" rx="34" fill="#05070c" stroke="#64748b" stroke-width="7"/>
<rect x="20" y="20" width="325" height="185" rx="24" fill="url(#phone)"/>
<circle cx="182" cy="215" r="7" fill="#64748b"/>
<rect x="48" y="52" width="120" height="12" rx="6" fill="#64748b"/>
<rect x="48" y="82" width="235" height="10" rx="5" fill="#cbd5e1"/>
<rect x="48" y="112" width="90" height="55" rx="12" fill="#dbeafe"/>
<path d="M60 154l25-22 22 14 35-38" fill="none" stroke="#2563eb" stroke-width="7"/>
<rect x="153" y="112" width="130" height="55" rx="12" fill="#e0f2fe"/>
<circle cx="185" cy="140" r="17" fill="#06b6d4"/><circle cx="232" cy="140" r="17" fill="#f59e0b"/>
</g>
<!-- floating campaign cards -->
<g filter="url(#shadow)">
<g transform="translate(260 250) rotate(-10)">
<rect width="260" height="155" rx="24" fill="#101a31" stroke="#263b60" stroke-width="3"/>
<text x="28" y="40" fill="#fff" font-family="Arial" font-size="23" font-weight="700">SEARCH GROWTH</text>
<path d="M30 120C75 95 100 112 135 78s55 8 100-48" fill="none" stroke="url(#cyan)" stroke-width="8"/>
<circle cx="235" cy="30" r="18" fill="#22d3ee"/>
</g>
<g transform="translate(1030 185) rotate(9)">
<rect width="290" height="175" rx="24" fill="#111a2d" stroke="#344b71" stroke-width="3"/>
<text x="28" y="43" fill="#fff" font-family="Arial" font-size="22" font-weight="700">CAMPAIGN ROI</text>
<text x="28" y="92" fill="#55e6a5" font-family="Arial" font-size="42" font-weight="800">+148%</text>
<rect x="28" y="120" width="230" height="10" rx="5" fill="#27364f"/>
<rect x="28" y="120" width="170" height="10" rx="5" fill="#55e6a5"/>
</g>
</g>
<!-- email -->
<g filter="url(#glow)" transform="translate(535 150)">
<circle cx="70" cy="70" r="70" fill="#f8fafc"/><path d="M30 45h80v55H30z" fill="#e2e8f0"/><path d="M30 45l40 32 40-32" fill="none" stroke="#64748b" stroke-width="7"/>
</g>
<!-- social nodes -->
<g filter="url(#glow)">
<circle cx="350" cy="520" r="58" fill="#ff5d28"/><text x="350" y="540" text-anchor="middle" fill="#fff" font-family="Arial" font-size="48" font-weight="800">@</text>
<circle cx="1230" cy="500" r="62" fill="#12bde5"/><path d="M1195 520c25-55 50-70 75-65" fill="none" stroke="#fff" stroke-width="9"/><circle cx="1192" cy="520" r="10" fill="#fff"/>
<circle cx="980" cy="110" r="58" fill="#ffb800"/><text x="980" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="60" font-weight="800">$</text>
</g>
<!-- lightbulb -->
<g transform="translate(410 120)"><circle cx="58" cy="58" r="50" fill="#ffb31a" opacity=".18"/><path d="M35 55c0-27 43-34 50-5 3 14-7 22-13 31v17H48V81C41 74 35 68 35 55z" fill="none" stroke="#ffb31a" stroke-width="8"/><path d="M47 111h22" stroke="#ffb31a" stroke-width="7"/></g>
<!-- cloud/data -->
<g transform="translate(785 180)"><path d="M30 105c-3-30 27-51 53-43 12-39 73-45 91-4 32-14 65 9 61 42 32 2 45 48 8 61H55c-28-2-42-33-25-56z" fill="#1d4f77" stroke="#42c6ef" stroke-width="4"/><path d="M62 124h130" stroke="#d8f6ff" stroke-width="5" opacity=".75"/></g>
<!-- decorative arcs -->
<path d="M115 585c100-150 230-180 350-150" fill="none" stroke="#1ec8e8" stroke-width="5" opacity=".35"/>
<path d="M1250 610c80-130 160-155 240-135" fill="none" stroke="#ff8a3d" stroke-width="5" opacity=".35"/>
</svg>