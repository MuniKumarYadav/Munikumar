name: Fix homepage SEO audit issues

on:
  push:
    branches:
      - fix/thin-content-seo
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  fix-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/thin-content-seo

      - name: Apply crawlable SEO/AEO/GEO content fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<title>AI-Powered Digital Marketing, SEO, AEO & GEO | Muni Kumar</title>',
              '<title>Digital Marketing, SEO, AEO & GEO | Muni Kumar</title>',
              1,
          )
          s = s.replace(
              '<meta property="og:title" content="AI-Powered Digital Marketing, SEO, AEO & GEO | Muni Kumar">',
              '<meta property="og:title" content="Digital Marketing, SEO, AEO & GEO | Muni Kumar">',
              1,
          )
          s = s.replace(
              '"name":"AI-Powered Digital Marketing, SEO, AEO & GEO | Muni Kumar"',
              '"name":"Digital Marketing, SEO, AEO & GEO | Muni Kumar"',
              1,
          )
          s = s.replace(
              '<h1 class="display">Build <span class="grad">digital growth</span> that compounds.</h1>',
              '<h1 class="display">AI-Powered <span class="grad">Digital Marketing, SEO, AEO & GEO</span></h1>',
              1,
          )

          anchor = '<section id="journey" class="section">'
          insert = '''<section id="answer-framework" class="section"><div class="wrap"><div class="section-head"><div class="label">QUICK ANSWERS / AEO</div><h2 class="display">What is digital marketing, and how do SEO, AEO and GEO fit into it?</h2><p class="section-copy"><strong>Definition:</strong> Digital marketing is the use of digital channels, content, technology and measurement to reach an audience and support a business outcome. SEO improves organic discoverability, AEO improves direct answerability, and GEO focuses on making information useful and understandable in generative search.</p><h3>Which approach should a business start with?</h3><p class="section-copy">Start with the business objective and customer journey, then prioritize the visibility layer that matches the problem. Search foundations, clear answers, entity information and measurable conversion paths can work together rather than being treated as isolated tactics.</p><ul class="section-copy"><li><strong>Discoverability:</strong> make important pages crawlable, relevant and easy to find.</li><li><strong>Answerability:</strong> provide concise answers to high-intent questions and support them with useful context.</li><li><strong>Entity clarity:</strong> keep the organization, services, audience and evidence consistent across the site.</li><li><strong>Measurement:</strong> connect visibility and engagement with qualified leads and business outcomes.</li></ul><div class="card" style="margin-top:28px;overflow:auto"><table class="table"><thead><tr><th>Approach</th><th>Primary purpose</th><th>Useful when</th></tr></thead><tbody><tr><td><strong>SEO</strong></td><td>Organic discoverability</td><td>People need to find your pages through search.</td></tr><tr><td><strong>AEO</strong></td><td>Direct answers</td><td>Customers ask specific questions and need concise responses.</td></tr><tr><td><strong>GEO</strong></td><td>Generative visibility</td><td>AI search needs clear entities, evidence and context.</td></tr></tbody></table></div></div></div></section>
<section class="section proof"><div class="wrap"><div class="section-head"><div class="label">IMPLEMENTATION EXAMPLE</div><h2 class="display">What does an AI-assisted growth workflow look like in practice?</h2><p class="section-copy"><strong>Example from this site:</strong> the homepage connects service pages, the SEO → AEO → GEO explanation, the 50-topic insight library, roadmaps and resources so a visitor can move from discovery to learning to a project conversation.</p><ol class="section-copy"><li>Identify the audience question and business outcome.</li><li>Publish the clearest answer on the relevant page.</li><li>Link supporting services, roadmaps and deeper insights.</li><li>Use AI for repeatable research or content operations with human review.</li><li>Measure useful discovery, engagement and qualified actions before scaling.</li></ol><p class="section-copy" style="margin-top:18px">This is a site-level implementation example, not a claim of customer performance data. It demonstrates the information architecture and workflow principles described on this page.</p></div></div></section>
'''
          if anchor not in s:
              raise SystemExit('Homepage journey anchor not found; refusing to modify file')
          s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: address homepage SEO AEO GEO audit findings"
          git push origin fix/thin-content-seo
