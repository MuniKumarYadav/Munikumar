name: Apply SEO audit fixes
on:
  push:
    branches: [fix/seo-audit-issues]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply SEO audit fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          def edit(path, fn):
              p=Path(path); s=p.read_text(); s2=fn(s); assert s2!=s, f'no change: {path}'; p.write_text(s2)

          # Remove heading-level skips on the homepage while retaining visual styling.
          edit('index.html', lambda s: s.replace('<h3', '<h2').replace('</h3>', '</h2>'))

          # Add contextual internal navigation to the existing site header.
          nav_links = '<a href="digital-marketing.html">Digital Marketing</a><a href="roadmaps.html">Roadmaps</a><a href="resources.html">Resources</a>'
          edit('index.html', lambda s: s.replace('<a href="blogs.html">Insights</a>', '<a href="blogs.html">Insights</a>'+nav_links))

          # Add useful, crawlable explanatory copy to pages currently flagged as thin.
          blocks = {
            'blogs.html': '''<section class="max-w-4xl mx-auto px-5 pb-16"><h2 class="font-display text-3xl font-bold">How to use this growth knowledge base</h2><p class="text-slate-400 leading-7 mt-4">Use these 50 insights as a practical learning and planning library. Start with the search fundamentals, then move into answer engine optimization and generative engine optimization as your content and measurement systems mature.</p><p class="text-slate-400 leading-7 mt-4">Each topic is intended to help connect a real business question with a useful content or measurement decision. Review the related topic, apply the idea to an existing page or campaign, and measure the outcome before expanding the workflow.</p><div class="grid md:grid-cols-3 gap-4 mt-8"><div class="glass rounded-2xl p-5"><h3 class="font-bold">SEO</h3><p class="text-sm text-slate-400 mt-2">Technical foundations, search intent, internal linking, structured data and organic growth.</p></div><div class="glass rounded-2xl p-5"><h3 class="font-bold">AEO</h3><p class="text-sm text-slate-400 mt-2">Clear questions, direct answers, extractable passages and answer-focused content structures.</p></div><div class="glass rounded-2xl p-5"><h3 class="font-bold">GEO</h3><p class="text-sm text-slate-400 mt-2">Entity clarity, evidence, mentions and citation-worthy information for generative search.</p></div></div></section>''',
            'roadmaps.html': '''<section class="max-w-4xl mx-auto px-5 pb-16"><h2 class="font-display text-3xl font-bold">How to learn with these roadmaps</h2><p class="text-slate-400 leading-7 mt-4">The roadmap library turns digital marketing disciplines into practical stages. Begin with fundamentals, complete the stages in sequence, and build small projects so the concepts become repeatable skills.</p><p class="text-slate-400 leading-7 mt-4">Search tracks cover SEO, AEO and GEO. Growth tracks cover analytics, paid media and brand demand. Content tracks cover content, social and email, while the AI track focuses on responsible AI-assisted marketing workflows and evaluation.</p><p class="text-slate-400 leading-7 mt-4">Use the <a class="text-cyan-400" href="blogs.html">50-blog knowledge base</a> alongside a roadmap for deeper explanations, then connect completed learning to a real website, campaign, content system or measurement dashboard.</p></section>''',
            'resources.html': '''<section class="max-w-4xl mx-auto px-5 pb-16"><h2 class="text-3xl font-bold">Resource Studio guidance</h2><p class="text-slate-400 leading-7 mt-4">Resource Studio is designed for organizing practical marketing assets such as checklists, presentations, documents, images and campaign materials. The browser-based workflow lets you upload files, prepare a poster-style preview, add a title, description, hashtags and a safe HTTP or HTTPS link, then save the published resource in the local browser library.</p><p class="text-slate-400 leading-7 mt-4">For discoverability, give every resource a descriptive title and useful context. Explain what the asset helps someone accomplish, who should use it, and what action should happen next. Keep claims specific and make linked destinations clear.</p><p class="text-slate-400 leading-7 mt-4">The library is local to the browser, so it should be treated as a working content-organization tool rather than a server-side document repository.</p></section>''',
            'contact.html': '''<section class="wrap section"><h2>Before you contact me</h2><p class="lead">A useful project conversation starts with a clear problem, audience and desired outcome. Whether you need SEO, content, AI workflow support, web development or CRM organization, a little context helps define the smallest useful first step.</p><div class="grid"><div class="card"><h3>Business context</h3><p>Share what the business does, who it serves and which market or location matters.</p></div><div class="card"><h3>Current challenge</h3><p>Describe the visibility, content, lead-management, technology or workflow problem you want to improve.</p></div><div class="card"><h3>Desired outcome</h3><p>Explain the measurable change you want, such as qualified enquiries, clearer reporting, faster operations or a stronger digital presence.</p></div></div></section>''',
            'about.html': '''<section class="section"><div class="wrap"><h2>Experience across marketing, technology and AI</h2><p class="lead">The work described across this site connects digital marketing strategy with practical implementation. That includes search visibility, content operations, websites, analytics, CRM organization and AI-assisted workflows.</p><div class="grid"><div class="card"><h3>Search visibility</h3><p>SEO, AEO and GEO work focuses on making useful information easier to discover, interpret and connect to the right audience.</p></div><div class="card"><h3>Digital systems</h3><p>Websites, dashboards and workflow tools turn marketing requirements into maintainable digital experiences.</p></div><div class="card"><h3>AI-assisted operations</h3><p>AI is applied where it can improve research, consistency, automation or productivity while keeping human review and business outcomes central.</p></div></div></div></section>''',
            'services.html': '''<section class="section"><div class="wrap"><h2>Service delivery approach</h2><p class="lead">Services can be combined into a practical growth system instead of treating every marketing activity as a separate project.</p><div class="two"><div class="card"><h3>1. Diagnose</h3><p>Understand the audience, business objective, existing digital assets, search visibility and operational constraints.</p></div><div class="card"><h3>2. Prioritize</h3><p>Choose the smallest set of changes that can create useful evidence and measurable progress.</p></div><div class="card"><h3>3. Build</h3><p>Implement content, website, analytics, CRM or automation workflows using maintainable tools and clear ownership.</p></div><div class="card"><h3>4. Measure and improve</h3><p>Review visibility, engagement, qualified leads and workflow outcomes before scaling what works.</p></div></div><h2>Core service areas</h2><p>Digital marketing covers strategy, content and campaign planning. SEO, AEO and GEO improve search and AI-search visibility. Web development and IT support digital experiences and internal systems. AI and automation reduce repetitive work, while analytics connects activity to business outcomes.</p></div></section>'''
          }
          for path, block in blocks.items():
              edit(path, lambda s, block=block: s.replace('</main>', block+'</main>', 1))

          # Canonical duplicate entry point: permanently redirect /index.html to /.
          Path('vercel.json').write_text(json.dumps({'redirects':[{'source':'/index.html','destination':'/','permanent':True}]}, indent=2)+'\n')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blogs.html roadmaps.html resources.html contact.html about.html services.html vercel.json
          git diff --cached --check
          git commit -m "Apply SEO audit fixes"
          git push
